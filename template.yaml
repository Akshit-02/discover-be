AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Influencer Discovery Backend

Globals:
  Function:
    Timeout: 900
    LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN

Parameters:
  Environment:
    Type: String
    Default: dev
  StackName:
    Type: String
    Default: influencer-discovery
  LogLevel:
    Type: String
    Default: INFO
    Description: Log level for Lambda functions
  NeonDatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon Postgres connection string
  RazorpayKeyId:
    Type: String
    Description: Razorpay key id (public, used by Checkout)
  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Description: Razorpay key secret
  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Razorpay webhook secret (order.paid); webhook rejects everything while empty

Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  LambdaLayers:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./layers/template.yaml
      Parameters:
        StackName: !Ref StackName

  DynamoDB:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./dynamodb/template.yaml
      Parameters:
        Environment: !Ref Environment
        StackName: !Ref StackName

  Cognito:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./cognito/template.yaml
      Parameters:
        Environment: !Ref Environment
        StackName: !Ref StackName
        LogLevel: !Ref LogLevel
        LambdaRoleArn: !GetAtt LambdaRole.Arn
        CommonLambdaLayer: !GetAtt LambdaLayers.Outputs.CommonLambdaLayer
        DynamoDBLayer: !GetAtt LambdaLayers.Outputs.DynamoDBLayer
        UtilsLayer: !GetAtt LambdaLayers.Outputs.UtilsLayer
        UsersTableName: !GetAtt DynamoDB.Outputs.UsersTableName
        CreditsTableName: !GetAtt DynamoDB.Outputs.CreditsTableName

  AppSync:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./appsync/template.yaml
      Parameters:
        Environment: !Ref Environment
        StackName: !Ref StackName
        LogLevel: !Ref LogLevel
        UserPoolId: !GetAtt Cognito.Outputs.UserPoolId
        LambdaRoleArn: !GetAtt LambdaRole.Arn
        CommonLambdaLayer: !GetAtt LambdaLayers.Outputs.CommonLambdaLayer
        DynamoDBLayer: !GetAtt LambdaLayers.Outputs.DynamoDBLayer
        UtilsLayer: !GetAtt LambdaLayers.Outputs.UtilsLayer
        UsersTableName: !GetAtt DynamoDB.Outputs.UsersTableName
        PostgresLayer: !GetAtt LambdaLayers.Outputs.PostgresLayer
        NeonDatabaseUrl: !Ref NeonDatabaseUrl
        UserListsTableName: !GetAtt DynamoDB.Outputs.UserListsTableName
        CreditsTableName: !GetAtt DynamoDB.Outputs.CreditsTableName
        RazorpayKeyId: !Ref RazorpayKeyId
        RazorpayKeySecret: !Ref RazorpayKeySecret
        RazorpayWebhookSecret: !Ref RazorpayWebhookSecret
        SupportMessagesTableName: !GetAtt DynamoDB.Outputs.SupportMessagesTableName

Outputs:
  UserPoolId:
    Value: !GetAtt Cognito.Outputs.UserPoolId
  UserPoolClientId:
    Value: !GetAtt Cognito.Outputs.UserPoolClientId
  GraphQLApiUrl:
    Value: !GetAtt AppSync.Outputs.GraphQLApiUrl
  RazorpayWebhookUrl:
    Description: Add this URL in Razorpay Dashboard → Webhooks (event order.paid)
    Value: !GetAtt AppSync.Outputs.RazorpayWebhookUrl
  UsersTableName:
    Value: !GetAtt DynamoDB.Outputs.UsersTableName
  UserListsTableName:
    Value: !GetAtt DynamoDB.Outputs.UserListsTableName
  CreditsTableName:
    Value: !GetAtt DynamoDB.Outputs.CreditsTableName
  SupportMessagesTableName:
    Value: !GetAtt DynamoDB.Outputs.SupportMessagesTableName
