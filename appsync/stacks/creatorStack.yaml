AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Creator Stack for Influencer Discovery

Parameters:
  StackName:
    Type: String
    Default: influencer-discovery
  LogLevel:
    Type: String
    Default: INFO
  AppSyncLambdaInvokeRoleArn:
    Type: String
  GraphQLAPI:
    Type: String
  LambdaRoleArn:
    Type: String
  CommonLambdaLayer:
    Type: String
  DynamoDBLayer:
    Type: String
  UtilsLayer:
    Type: String
  PostgresLayer:
    Type: String
  NeonDatabaseUrl:
    Type: String
    NoEcho: true
  UsersTableName:
    Type: String
  CreditsTableName:
    Type: String
  RazorpayKeyId:
    Type: String
  RazorpayKeySecret:
    Type: String
    NoEcho: true
  RazorpayWebhookSecret:
    Type: String
    NoEcho: true

# Define reusables with anchors
Metadata:
  ResolverRuntime: &ResolverRuntime
    Name: APPSYNC_JS
    RuntimeVersion: 1.0.0
  ResolverCode: &ResolverCode |
    import { util } from "@aws-appsync/utils";

    export function request(ctx) {
      return {
        operation: "Invoke",
        payload: {
          arguments: ctx.args,
          source: ctx.source,
          identity: ctx.identity,
          fieldName: ctx.info.fieldName,
        },
      };
    }

    export function response(ctx) {
      if (ctx.error) util.error(ctx.error.message, ctx.error.type);
      // Handled errors come back as data so the client gets a stable errorType.
      const failure = ctx.result && ctx.result.__error;
      if (failure) util.error(failure.message, failure.type, null, failure.info);
      return ctx.result;
    }

Globals:
  Function:
    Timeout: 30
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

Resources:
  CreatorsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-creators"
      RetentionInDays: 3

  CreatorsFunction:
    Type: AWS::Serverless::Function
    DependsOn: CreatorsFunctionLogGroup
    Properties:
      FunctionName: !Sub "${StackName}-creators"
      CodeUri: ../handlers/creators
      Handler: index.handler
      Role: !Ref LambdaRoleArn
      Runtime: nodejs22.x
      MemorySize: 256
      Layers:
        - !Ref CommonLambdaLayer
        - !Ref DynamoDBLayer
        - !Ref PostgresLayer
        - !Ref UtilsLayer
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          STACK_NAME: !Ref StackName
          DATABASE_URL: !Ref NeonDatabaseUrl
          USERS_TABLE: !Ref UsersTableName
          CREDITS_TABLE: !Ref CreditsTableName
          RAZORPAY_KEY_ID: !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret

  CreatorsDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLAPI
      Name: CreatorsDataSource
      Type: AWS_LAMBDA
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CreatorsFunction.Arn
      ServiceRoleArn: !Ref AppSyncLambdaInvokeRoleArn

  ListCreatorsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Query
      FieldName: listCreators
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  CreatorFilterOptionsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Query
      FieldName: creatorFilterOptions
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  MyCreditsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Query
      FieldName: myCredits
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  OpenCreatorProfileResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Mutation
      FieldName: openCreatorProfile
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  RevealCreatorContactResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Mutation
      FieldName: revealCreatorContact
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  CreateCreditOrderResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Mutation
      FieldName: createCreditOrder
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  VerifyCreditPaymentResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLAPI
      TypeName: Mutation
      FieldName: verifyCreditPayment
      DataSourceName: !GetAtt CreatorsDataSource.Name
      Runtime: *ResolverRuntime
      Code: *ResolverCode

  RazorpayWebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-razorpay-webhook"
      RetentionInDays: 14

  # Public URL for Razorpay webhooks; every request is authenticated by its HMAC signature.
  RazorpayWebhookFunction:
    Type: AWS::Serverless::Function
    DependsOn: RazorpayWebhookFunctionLogGroup
    Properties:
      FunctionName: !Sub "${StackName}-razorpay-webhook"
      CodeUri: ../handlers/creators
      Handler: webhook.handler
      Role: !Ref LambdaRoleArn
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 15
      Layers:
        - !Ref CommonLambdaLayer
        - !Ref DynamoDBLayer
        - !Ref UtilsLayer
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          USERS_TABLE: !Ref UsersTableName
          CREDITS_TABLE: !Ref CreditsTableName
          RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  RazorpayWebhookUrl:
    Value: !GetAtt RazorpayWebhookFunctionUrl.FunctionUrl
