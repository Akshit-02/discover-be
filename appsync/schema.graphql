type Creator @aws_cognito_user_pools {
  id: ID!
  name: String
  username: String!
  "Contact details are only returned by revealCreatorContact / openCreatorProfile."
  hasEmail: Boolean!
  hasPhone: Boolean!
  followers: Int
  following: Int
  totalPosts: Int
  avgLikes: Int
  avgViews: Int
  avgComments: Int
  avgEngagementRate: Float
  postingFrequency: Int
  gender: String
  city: String
  state: String
  country: String
  niches: [String]
  languages: [String]
  isVerified: Boolean
  collaborationTypes: [String]
  currency: Int
  reelPrice: Int
  storyPrice: Int
  shortVideoPrice: Int
  longVideoPrice: Int
  mid: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type CreatorConnection @aws_cognito_user_pools {
  items: [Creator!]!
  nextToken: String
}

enum CreatorSort {
  FOLLOWERS_DESC
  FOLLOWERS_ASC
  ENGAGEMENT_DESC
  VIEWS_DESC
  LIKES_DESC
  REEL_PRICE_ASC
  NEWEST
}

enum CreatorGender {
  MALE
  FEMALE
  OTHER
  UNKNOWN
}

input IntRangeInput {
  min: Int
  max: Int
}

input CreatorFilterInput {
  "Matches name or @username (case-insensitive, partial)."
  search: String
  "Niche slugs, e.g. fashion-lifestyle. Matches creators with any of them."
  niches: [String!]
  countries: [String!]
  states: [String!]
  cities: [String!]
  languages: [String!]
  genders: [CreatorGender!]
  "Follower ranges (min inclusive, max exclusive), OR-ed together."
  followerRanges: [IntRangeInput!]
  minEngagementRate: Float
  maxEngagementRate: Float
  minAvgViews: Int
  minAvgLikes: Int
  "Minimum posts per month."
  minPostingFrequency: Int
  maxReelPrice: Int
  verifiedOnly: Boolean
  hasEmail: Boolean
  hasPhone: Boolean
  "Has an email or a phone number."
  hasContact: Boolean
}

type CreatorSearchStats @aws_cognito_user_pools {
  totalReach: Float!
  avgEngagementRate: Float
  verifiedCount: Int!
}

type CreatorSearchResult @aws_cognito_user_pools {
  items: [Creator!]!
  nextToken: String
  "Total matches; only returned on the first page (no nextToken)."
  totalCount: Int
  stats: CreatorSearchStats
  "Credits spent on this request (advanced filters are charged once per set per 24h)."
  creditsCharged: Int!
  "Updated balance when advanced filters were used."
  credits: CreditBalance
}

type FacetOption @aws_cognito_user_pools {
  value: String!
  count: Int!
}

type CreatorFilterOptions @aws_cognito_user_pools {
  niches: [FacetOption!]!
  countries: [FacetOption!]!
  states: [FacetOption!]!
  cities: [FacetOption!]!
  languages: [FacetOption!]!
  genders: [FacetOption!]!
}

type Query {
  listCreators(filter: CreatorFilterInput, sort: CreatorSort, limit: Int, nextToken: String): CreatorSearchResult! @aws_cognito_user_pools
  creatorFilterOptions: CreatorFilterOptions! @aws_cognito_user_pools
  myCredits: CreditBalance! @aws_cognito_user_pools
  listMyLists: [UserList!]! @aws_cognito_user_pools
  getUserList(id: ID!): UserList @aws_cognito_user_pools
  listCreatorsInList(listId: ID!, limit: Int, nextToken: String): CreatorConnection! @aws_cognito_user_pools
  getCreatorListIds(creatorId: ID!): [ID!]! @aws_cognito_user_pools
  "Caller's 20 most recent messages, newest first."
  listMySupportMessages: [SupportMessage!]! @aws_cognito_user_pools
  getUserById(id: ID!): Users @aws_cognito_user_pools
  getMe: Users @aws_cognito_user_pools
}

type CreditCosts @aws_cognito_user_pools {
  advancedFilter: Int!
  revealEmail: Int!
  revealPhone: Int!
  openProfile: Int!
}

type CreditBalance @aws_cognito_user_pools {
  "Spendable credits; 0 once expired."
  balance: Int!
  expiresAt: AWSDateTime
  expired: Boolean!
  costs: CreditCosts!
}

enum ContactField {
  EMAIL
  PHONE
}

type ContactReveal @aws_cognito_user_pools {
  creatorId: ID!
  field: ContactField!
  "False when the creator has no such contact; nothing is charged then."
  available: Boolean!
  value: String
  charged: Int!
  credits: CreditBalance!
}

type CreatorProfile @aws_cognito_user_pools {
  creator: Creator!
  "Only set when previously revealed."
  email: String
  phone: String
  emailRevealed: Boolean!
  phoneRevealed: Boolean!
  charged: Int!
  credits: CreditBalance!
}

type Mutation {
  "Costs credits the first time a creator's profile is opened."
  openCreatorProfile(id: ID!): CreatorProfile! @aws_cognito_user_pools
  revealCreatorContact(creatorId: ID!, field: ContactField!): ContactReveal! @aws_cognito_user_pools
  createUserList(input: CreateUserListInput!): UserList! @aws_cognito_user_pools
  updateUserList(id: ID!, input: UpdateUserListInput!): UserList! @aws_cognito_user_pools
  deleteUserList(id: ID!): Boolean! @aws_cognito_user_pools
  addCreatorToList(listId: ID!, creatorId: ID!): UserList! @aws_cognito_user_pools
  removeCreatorFromList(listId: ID!, creatorId: ID!): UserList! @aws_cognito_user_pools
  submitSupportMessage(input: SupportMessageInput!): SupportMessage! @aws_cognito_user_pools
  updateMyProfile(input: UpdateProfileInput!): Users! @aws_cognito_user_pools
}

type UserList @aws_cognito_user_pools {
  id: ID!
  name: String!
  description: String
  creatorCount: Int!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input CreateUserListInput {
  name: String!
  description: String
}

input UpdateUserListInput {
  name: String
  description: String
}

enum SupportMessageType {
  SUGGESTION
  FEEDBACK
  QUERY
  BUG
}

enum SupportMessageStatus {
  OPEN
  IN_PROGRESS
  RESOLVED
}

type SupportMessage @aws_cognito_user_pools {
  id: ID!
  type: SupportMessageType!
  subject: String!
  message: String!
  status: SupportMessageStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input SupportMessageInput {
  type: SupportMessageType!
  subject: String!
  message: String!
  "Page the user was on, for context."
  page: String
}

type Users @aws_cognito_user_pools {
  id: ID!
  email: String!
  name: String
  phone: String
  jobTitle: String
  companyName: String
  companyWebsite: String
  industry: String
  companySize: String
  monthlyBudget: String
  city: String
  country: String
  marketingOptIn: Boolean
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

input UpdateProfileInput {
  name: String!
  phone: String
  jobTitle: String
  companyName: String
  companyWebsite: String
  industry: String
  companySize: String
  monthlyBudget: String
  city: String
  country: String
  marketingOptIn: Boolean
}

schema {
  query: Query
  mutation: Mutation
}