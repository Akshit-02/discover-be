AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cognito Authentication for Influencer Discovery

Parameters:
  Environment:
    Type: String
    Default: dev
  StackName:
    Type: String
    Default: influencer-discovery
  LogLevel:
    Type: String
    Default: INFO
    Description: Log level for Lambda functions
  LambdaRoleArn:
    Type: String
    Description: ARN of the Lambda execution role
  CommonLambdaLayer:
    Type: String
    Description: ARN of the Common Lambda layer
  DynamoDBLayer:
    Type: String
    Description: ARN of the DynamoDB Lambda layer
  UtilsLayer:
    Type: String
    Description: ARN of the Utils Lambda layer
  UsersTableName:
    Type: String
    Description: Name of the users DynamoDB table
  CreditsTableName:
    Type: String
    Description: Name of the credits DynamoDB table

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        STACK_NAME: !Ref StackName
        LOG_LEVEL: !Ref LogLevel

Resources:
  PostConfirmationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-post-confirmation"
      RetentionInDays: 3

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    DependsOn: PostConfirmationFunctionLogGroup
    Properties:
      CodeUri: functions/post-confirmation/
      FunctionName: !Sub "${StackName}-post-confirmation"
      Handler: index.handler
      Role: !Ref LambdaRoleArn
      Layers:
        - !Ref CommonLambdaLayer
        - !Ref UtilsLayer
        - !Ref DynamoDBLayer
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableName
          CREDITS_TABLE: !Ref CreditsTableName

  CustomMessageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-custom-message"
      RetentionInDays: 3

  # Branded HTML emails for signup, resend, password reset and email change codes.
  CustomMessageFunction:
    Type: AWS::Serverless::Function
    DependsOn: CustomMessageFunctionLogGroup
    Properties:
      CodeUri: functions/custom-message/
      FunctionName: !Sub "${StackName}-custom-message"
      Handler: index.handler
      Role: !Ref LambdaRoleArn
      Timeout: 5
      Layers:
        - !Ref UtilsLayer

  CustomMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CustomMessageFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${StackName}-user-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        # Fallback only: the CustomMessage trigger sends the branded HTML version.
        EmailSubject: "Verify your email for Kudozz"
        EmailMessage: "<p>Hi there,</p><p>Thanks for signing up for Kudozz Influencer Discovery. Your verification code is:</p><p style=\"font-size:24px;font-weight:bold;letter-spacing:6px\">{####}</p><p>This code expires in 24 hours. If you didn't create a Kudozz account, you can safely ignore this email.</p><p>— The Kudozz team</p>"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
        CustomMessage: !GetAtt CustomMessageFunction.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${StackName}-user-pool-client"
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      GenerateSecret: false

Outputs:
  UserPoolId:
    Description: "ID of the Cognito User Pool"
    Value: !Ref CognitoUserPool
  UserPoolArn:
    Value: !GetAtt CognitoUserPool.Arn
  UserPoolClientId:
    Description: "ID of the Cognito User Pool Client"
    Value: !Ref CognitoUserPoolClient
